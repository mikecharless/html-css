<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoclasse</title>
    <style>
        div {
            display: inline-block;
            background-color: lightgray;
            width: 300px;
            height: 150px;
            text-align: center;
            border: 1px solid black;
        }

        /*: é o símbolo da pseudoclasse. É uma ferramenta relacionada ao estado do elemento. */
        div:hover {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div id="d1">d1</div>
    <div id="d2">d2</div>
    <div id="d3">d3</div>
</body>
</html>
