<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafo</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um paragráfo de 
        qualquer jeito
        bastar estar entre as tags ou marcadores p 
    </p>
    <p>se voce quiser fazer
         uma quebra, em um lugar 
         como esse <br> 
         use a tag &lt;br&gt;</p> <!--less than   greater than-->

    <p>
        Adicionando alguns símbolos
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &uparrow;
        &rightarrow;
    </p>

    <p>
        Adicionando emojis:
        &#x1F60E;

    </p>

</body>
</html>
